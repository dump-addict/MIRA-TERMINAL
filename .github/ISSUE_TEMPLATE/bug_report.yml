name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. For a security issue, do not use this form, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project
        2. Start Codex in a split pane
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Terminals and tabs
        - Agents and message box
        - Project map
        - Tasks
        - Dictation
        - Settings
        - Other
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent involved
      multiple: true
      options:
        - None
        - Claude Code
        - Codex
        - Gemini CLI
        - Cursor CLI
        - GitHub Copilot CLI
        - Grok CLI
  - type: input
    id: version
    attributes:
      label: Mira version or commit
      description: Shown in Settings, or `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26.1 on Apple M3, Windows 11 x64, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Anything that helps. Remove secrets and private paths first.
