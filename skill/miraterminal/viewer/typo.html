<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal type</title>
<link rel="stylesheet" href="/viewer/tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500;600&family=Fragment+Mono&family=Azeret+Mono:wght@400;500;600&family=Space+Mono:wght@400;700&family=Spline+Sans+Mono:wght@400;500;600&family=Kode+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg:var(--mira-bg); --bg2:var(--mira-surface-1); --line:var(--mira-line); --line2:var(--mira-line-strong); --txt:var(--mira-text); --mut:var(--mira-text-2); --dim:var(--mira-text-3); --ok:var(--mira-ok); --warn:var(--mira-warn); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--txt); font: 14px/1.5 var(--mira-font); -webkit-font-smoothing: antialiased; }
header { padding: 20px 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 16px; }
header b { font-weight: 600; }
#pick { color: var(--mut); font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); }
.opt { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 24px; cursor: pointer; }
.opt:hover { background: var(--bg2); }
.opt.on { background: var(--bg2); box-shadow: inset 0 0 0 1px var(--txt); }
.top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; color: var(--mut); font-size: 12px; }
.top .l { color: var(--txt); font-weight: 600; }
.big { font-size: 34px; letter-spacing: -.03em; line-height: 1.05; margin: 0 0 6px; font-weight: 500; }
.big span { color: var(--mut); }
.sub { color: var(--mut); font-size: 13px; margin-bottom: 20px; }
.zone { border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.zh { font-size: 12px; font-weight: 500; color: var(--dim); margin-bottom: 10px; display: flex; gap: 7px; align-items: center; }
.zh i { width: 7px; height: 7px; border-radius: 2px; background: var(--txt); }
.card { background: var(--bg2); border: 1px solid var(--line2); border-radius: 8px; padding: 12px 14px; }
.kl { font-size: 11px; color: var(--dim); margin-bottom: 6px; }
.ct { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.cs { font-size: 12px; color: var(--mut); margin-bottom: 10px; }
.cf { display: flex; gap: 6px; }
.chip { border: 1px solid var(--line2); border-radius: 999px; padding: 2px 9px; font-size: 11px; color: var(--mut); }
.chip.ok { color: var(--ok); }
.row { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 11px; color: var(--mut); }
.row hr { flex: 1; border: 0; border-top: 1px solid var(--line2); margin: 0; }
.row .lab { border: 1px solid var(--line2); border-radius: 6px; padding: 1px 7px; color: var(--txt); background: var(--bg2); }
.digits { margin-top: 12px; font-size: 12px; color: var(--mut); }
.digits b { color: var(--txt); font-weight: 500; }
</style>
</head>
<body>
<header><b>Terminal type</b><span id="pick">Click an option</span></header>
<div class="grid" id="grid"></div>
<script>
const FONTS = [
  ["A", "Martian Mono", "wide and square, very instrument-like"],
  ["B", "Fragment Mono", "close to a grotesque, soft"],
  ["C", "Azeret Mono", "geometric, technical, crisp"],
  ["D", "Space Mono", "retro, strong character"],
  ["E", "Spline Sans Mono", "round, modern, readable"],
  ["F", "Kode Mono", "angular, code feel"],
];
const g = document.getElementById("grid");
let saved = null; try { saved = localStorage.getItem("pm.font"); } catch (e) {}
g.innerHTML = FONTS.map(([k, f, d]) => `
  <div class="opt${saved === f ? " on" : ""}" data-f="${f}" style="font-family:'${f}', ui-monospace, monospace">
    <div class="top"><span class="l">${k}  ${f}</span><span>${d}</span></div>
    <p class="big">Mira Terminal. <span>The project map.</span></p>
    <div class="sub">30 blocks, 33 links, 39 checks</div>
    <div class="zone">
      <div class="zh"><i></i>Web app</div>
      <div class="card">
        <div class="kl">Wallet</div>
        <div class="ct">Connect Wallet</div>
        <div class="cs">Custom Connect window: live extensions (EIP-6963), email.</div>
        <div class="cf"><span class="chip ok">● Available</span><span class="chip">2 to do</span></div>
      </div>
      <div class="row"><hr><span class="lab">ApproveAgent signed</span><hr></div>
    </div>
    <div class="digits">0123456789  <b>0 tickets</b>  127.0.0.1:4700  {} [] → ≈</div>
  </div>`).join("");
g.onclick = (e) => {
  const o = e.target.closest(".opt"); if (!o) return;
  g.querySelectorAll(".opt").forEach((x) => x.classList.toggle("on", x === o));
  try { localStorage.setItem("pm.font", o.dataset.f); } catch (err) {}
  document.getElementById("pick").textContent = `Picked: ${o.dataset.f}`;
};
</script>
</body>
</html>
